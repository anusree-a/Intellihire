<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Sign In</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0f172a; color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }
.container { background:#1e293b; border:1px solid rgba(99,102,241,0.25); border-radius:20px; padding:48px 40px; width:100%; max-width:420px; text-align:center; }
.icon { font-size:3.2em; margin-bottom:18px; }
h2 { font-size:1.9em; margin-bottom:6px; }
h2 span { background:linear-gradient(135deg,#818cf8,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sub { color:#94a3b8; margin-bottom:30px; font-size:0.95em; }
.fg { margin-bottom:18px; text-align:left; }
.fg label { display:block; color:#94a3b8; font-size:0.9em; margin-bottom:6px; }
.fg input { width:100%; padding:13px 16px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#fff; font-size:1em; outline:none; transition:border 0.2s; }
.fg input:focus { border-color:#818cf8; }
.btn { width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; font-size:1.05em; font-weight:600; cursor:pointer; transition:all 0.3s; margin-top:6px; }
.btn:hover { box-shadow:0 6px 24px rgba(99,102,241,0.4); transform:translateY(-2px); }
.back { display:inline-block; margin-top:22px; color:#64748b; text-decoration:none; font-size:0.9em; }
.back:hover { color:#a5b4fc; }
.err { background:#991b1b; border-left:4px solid #ef4444; padding:12px 16px; border-radius:8px; margin-bottom:18px; font-size:0.9em; text-align:left; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">👔</div>
  <h2>HR <span>Sign In</span></h2>
  <p class="sub">Enter your credentials provided by your company</p>
  {% if messages %}{% for m in messages %}<div class="err">{{ m }}</div>{% endfor %}{% endif %}
  <form method="POST">
    {% csrf_token %}
    <div class="fg"><label>Email</label><input type="email" name="email" required placeholder="you@company.com"></div>
    <div class="fg"><label>Password</label><input type="password" name="password" required></div>
    <button type="submit" class="btn">Sign In</button>
  </form>
  <a href="{% url 'home' %}" class="back">← Back to Home</a>
</div>
</body>
</html>
